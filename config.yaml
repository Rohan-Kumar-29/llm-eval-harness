task: structured_extraction
dataset_path: data/seed_dataset.jsonl
human_quality_path: data/human_quality.jsonl

models:
  - id: gemini/gemini-2.5-flash
    label: gemini-flash
  - id: groq/llama-3.3-70b-versatile
    label: llama-70b
  - id: openrouter/meta-llama/llama-3.1-8b-instruct:free
    label: llama-8b-free
  # - id: ollama/llama3.1:8b    # uncomment for fully local runs
  #   label: llama-8b-local

judge_model:
  id: gemini/gemini-2.5-flash
  label: judge-gemini

prompts:
  - prompts/extract_v1.txt
  - prompts/extract_v2.txt

run:
  temperature: 0.0
  max_examples: 80
  concurrency: 4
  repeats: 1
  cache: true
  smoke_test: false
  judge_sample_size: 20   # number of examples to run through LLM judge (keeps quota low)
